<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Fondo: cuadrado redondeado en verde EcoMarket -->
  <rect width="64" height="64" rx="14" fill="#08c537"/>

  <!-- Hoja blanca estilizada (orientada diagonalmente) -->
  <path d="M51 11
           C 28 11, 11 28, 11 51
           C 11 53, 13 53, 15 53
           C 38 53, 53 38, 53 15
           C 53 13, 53 11, 51 11 Z"
        fill="#ffffff"/>

  <!-- Nervadura principal -->
  <path d="M14 50 L 49 15"
        stroke="#08c537"
        stroke-width="2.5"
        stroke-linecap="round"
        fill="none"/>

  <!-- Nervaduras laterales -->
  <path d="M21 43 L 30 38" stroke="#08c537" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <path d="M31 33 L 40 28" stroke="#08c537" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <path d="M40 24 L 46 21" stroke="#08c537" stroke-width="1.4" stroke-linecap="round" fill="none"/>
</svg>
